name: dragonfly_annotations
description: "Annotations consumed by dragonfly_builder to generate Dragonfly framework code."
version: 0.0.1
homepage:

# Pure Dart package: contains only const annotation classes and enums.
# It must not depend on Flutter, so that dragonfly_builder can stay Flutter-free
# and track the latest analyzer.
environment:
  sdk: ^3.8.0

dependencies:
  meta: ^1.16.0

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.0
