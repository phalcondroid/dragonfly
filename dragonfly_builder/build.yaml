builders:
  # Repository generator - generates network repository implementations
  repository_generator:
    import: "package:dragonfly_builder/builder.dart"
    builder_factories: ["repositoryGenerator"]
    build_extensions: { ".dart": [".repository.part"] }
    auto_apply: dependents
    build_to: source
    applies_builders: ["source_gen|combining_builder"]

  # Factory model generator - generates data/repository layer models
  factory_model_generator:
    import: "package:dragonfly_builder/builder.dart"
    builder_factories: ["factoryModelGenerator"]
    build_extensions: { ".dart": [".model.part"] }
    auto_apply: dependents
    build_to: source
    applies_builders: ["source_gen|combining_builder"]

  # Event model generator - generates BLoC event classes
  event_model_generator:
    import: "package:dragonfly_builder/builder.dart"
    builder_factories: ["eventModelGenerator"]
    build_extensions: { ".dart": [".event.part"] }
    auto_apply: dependents
    build_to: source
    applies_builders: ["source_gen|combining_builder"]

  # State model generator - generates BLoC state classes
  state_model_generator:
    import: "package:dragonfly_builder/builder.dart"
    builder_factories: ["stateModelGenerator"]
    build_extensions: { ".dart": [".state.part"] }
    auto_apply: dependents
    build_to: source
    applies_builders: ["source_gen|combining_builder"]

  # Dragonfly bloc generator - generates BLoC mixins
  dragonfly_bloc_generator:
    import: "package:dragonfly_builder/builder.dart"
    builder_factories: ["dragonflyBlocGenerator"]
    build_extensions: { ".dart": [".bloc.part"] }
    auto_apply: dependents
    build_to: source
    applies_builders: ["source_gen|combining_builder"]

  router_generator:
    import: "package:dragonfly_builder/builder.dart"
    builder_factories: ["routerBuilder"]
    build_extensions: { ".dart": [".router.dart"] }
    auto_apply: dependents
    build_to: source

  # Dragonfly BLoC view generator - generates BLoC view mixins and state builders
  dragonfly_bloc_view_generator:
    import: "package:dragonfly_builder/builder.dart"
    builder_factories: ["dragonflyBlocViewGenerator"]
    build_extensions: { ".dart": [".blocview.part"] }
    auto_apply: dependents
    build_to: source
    applies_builders: ["source_gen|combining_builder"]

  # Dragonfly state manager generator - generates state manager mixins and providers
  dragonfly_state_manager_generator:
    import: "package:dragonfly_builder/builder.dart"
    builder_factories: ["dragonflyStateManagerGenerator"]
    build_extensions: { ".dart": [".state_manager.part"] }
    auto_apply: dependents
    build_to: source
    applies_builders: ["source_gen|combining_builder"]

  # Injectable config generator - generates DI configuration
  injectable_config_builder:
    import: "package:dragonfly_builder/builder.dart"
    builder_factories: ["injectableConfigBuilder"]
    build_extensions: { ".dart": [".config.dart"] }
    auto_apply: dependents
    build_to: source
    applies_builders: ["source_gen|combining_builder"]

  # Form schema generator - generates form state and validation
  form_schema_generator:
    import: "package:dragonfly_builder/builder.dart"
    builder_factories: ["formSchemaGenerator"]
    build_extensions: { ".dart": [".form.part"] }
    auto_apply: dependents
    build_to: source
    applies_builders: ["source_gen|combining_builder"]
