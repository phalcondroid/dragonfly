name: dragonfly_builder
description: "Code generators for the Dragonfly framework."
version: 0.0.1
homepage:

# Pure Dart package. It emits references to package:dragonfly types as strings
# and must never depend on the runtime or on Flutter.
#
# CEILING: analyzer is capped at 8.x, not because of this package but because the
# Flutter SDK pins `meta 1.18.0` while analyzer >=13.1.0 requires `meta ^1.18.3`.
# dart_style >=3.1.12 in turn requires analyzer >=13.1.0. Raising either one makes
# `example/` (and every consuming Flutter app) fail to resolve. Revisit once the
# Flutter SDK ships meta >=1.18.3.
environment:
  sdk: ^3.8.0

dependencies:
  analyzer: ^8.4.0
  build: ">=4.0.0 <4.0.8"
  code_builder: ^4.10.0
  collection: ^1.19.1
  dart_style: ^3.1.0
  dragonfly_annotations:
    path: ../dragonfly_annotations
  glob: ^2.1.3
  meta: ^1.16.0
  path: ^1.9.0
  source_gen: ^4.0.0

dev_dependencies:
  build_runner: ^2.4.0
  lints: ^6.0.0
  test: ^1.25.0
