name: dragonfly
description: "Runtime library for the Dragonfly Flutter framework: DI, networking, state management, session/ACL, forms and logging."
version: 0.0.1
homepage:

environment:
  sdk: ^3.8.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  dragonfly_annotations:
    path: ../dragonfly_annotations
  http: ^1.6.0
  meta: ^1.16.0
  web_socket_channel: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# NOTE: hive, hive_flutter and uuid were previously declared here but never
# imported anywhere in lib/. HiveSessionStorage duck-types a `dynamic` box, so
# the consuming app owns the Hive dependency. They were removed rather than
# wired up; see docs/ai/known-gaps.md.

